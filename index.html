<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pintu Tak Terkunci — Simulasi Keamanan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0A0E1A; --panel:#151E2E; --panel-2:#20304480;
    --panel-solid:#1E2A3D;
    --brass:#E8B93F; --brass-soft:#B78F2E; --alert:#F0685C; --safe:#5FC189;
    --paper:#F6F2E7; --paper-dim:#C3CBD6; --line: rgba(246,242,231,0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;overflow-x:hidden;}
  ::selection{background:var(--brass);color:var(--ink);}
  h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;color:var(--paper);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{min-height:100vh;width:100%;position:relative;}
  .screen{min-height:100vh;width:100%;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 20px 60px;position:relative;}
  .screen.active{display:flex;}
  .screen.center{justify-content:center;}

  .grain{position:fixed;inset:0;pointer-events:none;opacity:0.05;z-index:0;
    background-image:radial-gradient(circle at 20% 30%, var(--paper) 0.5px, transparent 0.5px); background-size:3px 3px;}
  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.35;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(255,255,255,0.015) 3px);}

  .vault-wrap{position:relative;width:170px;height:170px;margin:0 auto 22px;}
  .vault-dial{width:100%;height:100%;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2c3f58, var(--panel) 60%, #0d1622 100%);
    border:3px solid var(--brass-soft); box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 0 0 6px rgba(232,185,63,0.08);
    display:flex;align-items:center;justify-content:center; position:relative;}
  .vault-dial::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1px solid var(--line);}
  .vault-needle{position:absolute;width:3px;height:58px;background:var(--brass);left:50%;bottom:50%;transform-origin:50% 100%;
    transform:translateX(-50%) rotate(0deg); border-radius:2px; transition: transform 1s cubic-bezier(.3,1.4,.4,1); box-shadow:0 0 10px rgba(232,185,63,0.7);}
  .vault-hub{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--brass);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(232,185,63,0.85);}
  .vault-crack{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;transition:opacity 0.6s ease;box-shadow: inset 0 0 40px 8px rgba(240,104,92,0.55);}
  .vault-wrap.ajar .vault-crack{opacity:1;}

  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--brass);margin-bottom:10px;}
  .headline{font-size:clamp(26px,7vw,40px);line-height:1.06;font-weight:700;margin:0 0 14px;text-align:center;letter-spacing:-0.01em;color:var(--paper);}
  .sub{font-size:15px;color:var(--paper-dim);text-align:center;max-width:420px;margin:0 auto 24px;line-height:1.6;}
  .max-w{max-width:460px;width:100%;margin:0 auto;}

  .btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;border:none;border-radius:10px;
    padding:16px 22px;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;gap:14px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brass);color:#241A05;justify-content:center;font-size:16px;}
  .btn-primary:hover{box-shadow:0 6px 20px rgba(232,185,63,0.3);}
  .btn-ghost{background:transparent;color:var(--paper-dim);border:1px solid var(--line);justify-content:center;font-size:13px;padding:10px 16px;width:auto;}
  .btn-ghost:hover{color:var(--paper);border-color:var(--brass-soft);}
  .choice{background:var(--panel-solid);border:1px solid var(--line);color:var(--paper);}
  .choice:hover{border-color:var(--brass-soft);}
  .choice .k{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:13px;flex-shrink:0;width:22px;}
  .choice .t{font-size:14.5px;line-height:1.4;color:var(--paper);}

  .mode-card{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;text-align:left;cursor:pointer;margin-bottom:14px;transition:border-color .15s ease, transform .15s ease;}
  .mode-card:active{transform:scale(0.98);}
  .mode-card:hover{border-color:var(--brass-soft);}
  .mode-card .mtag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
  .mode-card h3{margin:0 0 6px;font-size:19px;color:var(--paper);}
  .mode-card p{margin:0;font-size:13.5px;color:var(--paper-dim);line-height:1.55;}

  .badge{display:inline-flex;align-items:center;gap:8px;background:var(--panel-solid);border:1px solid var(--line);
    padding:6px 12px;border-radius:100px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper-dim);margin-bottom:18px;letter-spacing:0.04em;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--brass);}
  .case-file{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:24px 20px;margin-bottom:22px;position:relative;overflow:hidden;}
  .case-file::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);}
  .case-file p{font-size:15.5px;line-height:1.6;margin:0;color:var(--paper);}
  .case-file .scene{font-size:32px;margin-bottom:10px;display:block;}

  .consequence{border-radius:16px;padding:22px 20px;margin-bottom:16px;border:1px solid var(--line);animation:rise 0.4s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .consequence.bad{background:linear-gradient(180deg, rgba(240,104,92,0.14), rgba(240,104,92,0.03));border-color:rgba(240,104,92,0.4);}
  .consequence.good{background:linear-gradient(180deg, rgba(95,193,137,0.14), rgba(95,193,137,0.03));border-color:rgba(95,193,137,0.4);}
  .consequence .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
  .consequence.bad .tag{color:var(--alert);} .consequence.good .tag{color:var(--safe);}
  .consequence h3{font-size:19px;margin:0 0 8px;color:var(--paper);}
  .consequence p{font-size:14.5px;line-height:1.6;color:var(--paper-dim);margin:0 0 10px;}
  .consequence .fact{font-size:13px;color:var(--paper);background:rgba(0,0,0,0.25);padding:12px 14px;border-radius:10px;line-height:1.55;}

  .progress{display:flex;gap:6px;margin-bottom:24px;width:100%;max-width:280px;}
  .progress .seg{flex:1;height:4px;border-radius:2px;background:var(--panel-solid);overflow:hidden;}
  .progress .seg.done{background:var(--brass);} .progress .seg.now{background:linear-gradient(90deg,var(--brass),var(--panel-solid));}

  .stamp{width:106px;height:106px;border-radius:50%;border:3px solid var(--brass);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;transform:rotate(-6deg);}
  .stamp .n{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:var(--brass);}
  .result-grid{display:grid;grid-template-columns:1fr;gap:10px;width:100%;margin:20px 0;}
  .result-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .result-row .label{font-size:13.5px;color:var(--paper-dim);}
  .result-row .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:100px;letter-spacing:0.03em;}
  .pill.good{background:rgba(95,193,137,0.18);color:var(--safe);} .pill.bad{background:rgba(240,104,92,0.18);color:var(--alert);}
  .lab-link{background:transparent;border:1px solid var(--line);color:var(--brass);border-radius:8px;width:30px;height:30px;font-size:13px;cursor:pointer;padding:0;flex-shrink:0;}
  .lab-link:hover{border-color:var(--brass-soft);}
  .class-teaser{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--paper-dim);text-align:center;margin-top:18px;line-height:1.7;}
  .class-teaser b{color:var(--brass);}

  .lab-header{display:flex;align-items:center;gap:12px;width:100%;max-width:460px;margin-bottom:18px;}
  .back-btn{background:var(--panel-solid);border:1px solid var(--line);color:var(--paper-dim);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:16px;line-height:1;}
  .cat-tabs{display:flex;gap:8px;width:100%;max-width:460px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;}
  .cat-tab{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.04em;padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--panel-solid);color:var(--paper-dim);cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .cat-tab.active{background:var(--brass);color:#241A05;border-color:var(--brass);font-weight:600;}
  .attack-grid{display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:460px;}
  .attack-card{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;transition:border-color .15s ease, transform .15s ease;}
  .attack-card:active{transform:scale(0.98);}
  .attack-card:hover{border-color:var(--brass-soft);}
  .attack-card .icon{font-size:26px;flex-shrink:0;width:42px;height:42px;background:rgba(255,255,255,0.05);border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .attack-card .txt h4{margin:0 0 3px;font-size:15px;color:var(--paper);}
  .attack-card .txt p{margin:0;font-size:12.5px;color:var(--paper-dim);line-height:1.4;}
  .attack-card .cattag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--brass);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:3px;display:block;}

  .attack-stage{position:relative;width:100%;max-width:340px;height:190px;margin:0 auto 16px;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .attack-stage .actor{position:absolute;font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}
  .attack-stage .lbl{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--paper-dim);white-space:nowrap;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;}
  .attack-stage .line{position:absolute;height:2px;background:repeating-linear-gradient(90deg,var(--paper-dim) 0 6px, transparent 6px 12px);}
  .attack-stage .flyicon{position:absolute;font-size:15px;opacity:0;}
  .attack-stage .ring{position:absolute;border:2px solid var(--alert);border-radius:50%;opacity:0;}
  .attack-stage .bar{position:absolute;width:5px;background:var(--safe);border-radius:2px;bottom:22%;}

  .caption-box{width:100%;max-width:340px;min-height:48px;text-align:center;font-size:13.5px;color:var(--paper);margin:0 auto 18px;line-height:1.55;padding:0 8px;}
  .caption-dots{display:flex;gap:5px;justify-content:center;margin-bottom:10px;}
  .caption-dots span{width:6px;height:6px;border-radius:50%;background:var(--panel-solid);transition:background .2s ease;}
  .caption-dots span.on{background:var(--brass);}

  .info-block{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;width:100%;}
  .info-block .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brass);margin-bottom:8px;}
  .info-block p{margin:0;font-size:13.5px;line-height:1.6;color:var(--paper-dim);}
  .info-block ul{margin:0;padding-left:18px;}
  .info-block li{font-size:13.5px;line-height:1.7;color:var(--paper-dim);}
  .gterm{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .gterm:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .gterm b{display:block;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--brass);margin-bottom:4px;letter-spacing:0.02em;}
  .gterm span{font-size:13px;line-height:1.55;color:var(--paper-dim);}
  .attack-nav{display:flex;gap:10px;width:100%;max-width:340px;margin-top:6px;}

  /* ===== engines: base timing 6.4s per replay, slower pacing ===== */
  .eng-sniff .you{left:4%;top:62%;} .eng-sniff .srv{left:80%;top:62%;font-size:24px;}
  .eng-sniff .theline{left:16%;top:76%;width:68%;}
  .eng-sniff .packet{left:16%;top:70%;font-size:16px;opacity:0;}
  .eng-sniff .attacker{font-size:24px;opacity:0.35;}
  .eng-sniff:not(.mitm) .attacker{left:44%;top:12%;}
  .eng-sniff.mitm .attacker{left:44%;top:60%;}
  .eng-sniff .clone{left:44%;top:70%;font-size:13px;opacity:0;}
  @keyframes pkMove{0%{left:16%;opacity:0;}10%{opacity:1;}45%{left:44%;}60%{left:44%;}100%{left:80%;opacity:1;}}
  .eng-sniff.play .packet{animation:pkMove 6.4s ease-in-out forwards;}
  @keyframes atkPulse{0%,38%{opacity:0.35;transform:scale(1);}50%,60%{opacity:1;transform:scale(1.35);}75%,100%{opacity:0.55;transform:scale(1);}}
  .eng-sniff.play .attacker{animation:atkPulse 6.4s ease-in-out forwards;}
  @keyframes cloneUp{0%,48%{opacity:0;top:70%;}58%{opacity:1;top:70%;}100%{opacity:1;top:18%;}}
  @keyframes cloneStay{0%,48%{opacity:0;}58%,100%{opacity:1;}}
  .eng-sniff:not(.mitm).play .clone{animation:cloneUp 6.4s ease forwards;}
  .eng-sniff.mitm.play .clone{animation:cloneStay 6.4s ease forwards;}

  .eng-wardrive .car{left:2%;top:70%;font-size:24px;}
  .eng-wardrive .house{font-size:24px;}
  .eng-wardrive .house1{left:26%;top:30%;} .eng-wardrive .house2{left:50%;top:30%;} .eng-wardrive .house3{left:74%;top:30%;}
  .eng-wardrive .lock{position:absolute;font-size:12px;top:-14px;left:50%;transform:translateX(-50%);}
  .eng-wardrive .warn{position:absolute;font-size:16px;opacity:0;left:50%;top:-30px;transform:translateX(-50%);}
  @keyframes carMove{0%{left:2%;}55%{left:44%;}75%{left:44%;}100%{left:86%;}}
  .eng-wardrive.play .car{animation:carMove 6.4s ease-in-out forwards;}
  @keyframes warnPop{0%,54%{opacity:0;transform:translateX(-50%) scale(0.5);}64%,85%{opacity:1;transform:translateX(-50%) scale(1.1);}100%{opacity:0.75;transform:translateX(-50%) scale(1);}}
  .eng-wardrive.play .house2 .warn{animation:warnPop 6.4s ease-in-out forwards;}

  .eng-jam .wifi{left:44%;top:36%;font-size:34px;}
  .eng-jam .attacker{left:80%;top:60%;font-size:26px;}
  .eng-jam .barrow{position:absolute;left:44%;top:78%;display:flex;gap:3px;}
  .eng-jam .ring{left:80%;top:60%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;}
  .eng-jam .xmark{position:absolute;left:44%;top:36%;font-size:34px;opacity:0;}
  @keyframes ringGrow{0%{width:20px;height:20px;margin-left:-10px;margin-top:-10px;opacity:0.8;}100%{width:90px;height:90px;margin-left:-45px;margin-top:-45px;opacity:0;}}
  .eng-jam.play .ring{animation:ringGrow 2.1s ease-out infinite;}
  .eng-jam.play .ring2{animation-delay:0.7s;}
  .eng-jam.play .ring3{animation-delay:1.4s;}
  @keyframes barShrink{0%,25%{transform:scaleY(1);opacity:1;}92%,100%{transform:scaleY(0.05);opacity:0.3;}}
  .eng-jam.play .bar{animation:barShrink 6.4s ease-in forwards;}
  @keyframes xFade{0%,75%{opacity:0;}100%{opacity:1;}}
  .eng-jam.play .xmark{animation:xFade 6.4s ease forwards;color:var(--alert);}

  .eng-bt .device{left:8%;top:56%;font-size:28px;} .eng-bt .attacker{left:76%;top:56%;font-size:26px;}
  .eng-bt .ring{left:8%;top:56%;width:20px;height:20px;margin-left:4px;margin-top:4px;border-color:var(--brass);}
  .eng-bt .conn{position:absolute;left:24%;top:63%;width:0%;height:2px;background:var(--alert);opacity:0;}
  .eng-bt .flyicon{top:60%;left:24%;}
  @keyframes btRing{0%{width:20px;height:20px;opacity:0.9;}100%{width:70px;height:70px;margin-left:-11px;margin-top:-11px;opacity:0;}}
  .eng-bt.play .ring{animation:btRing 1.6s ease-out 2;}
  @keyframes connGrow{0%,55%{width:0%;opacity:0;}65%{opacity:1;}100%{width:52%;opacity:1;}}
  .eng-bt.play .conn{animation:connGrow 6.4s ease forwards;}
  @keyframes fly1{0%,65%{opacity:0;left:24%;top:60%;}78%{opacity:1;}100%{opacity:1;left:74%;top:56%;}}
  @keyframes fly2{0%,73%{opacity:0;left:24%;top:66%;}86%{opacity:1;}100%{opacity:1;left:74%;top:62%;}}
  .eng-bt.play .fly1{animation:fly1 6.4s ease forwards;}
  .eng-bt.play .fly2{animation:fly2 6.4s ease forwards;}

  .eng-infect .phone{left:38%;top:50%;font-size:32px;}
  .eng-infect .attacker{left:82%;top:30%;font-size:24px;opacity:0;}
  .eng-infect .app{left:40%;top:14%;font-size:22px;}
  .eng-infect .skull{left:40%;top:14%;font-size:22px;opacity:0;}
  .eng-infect .track{position:absolute;left:24%;top:34%;width:52%;height:5px;background:var(--panel-solid);border-radius:3px;overflow:hidden;}
  .eng-infect .fill{height:100%;width:0%;background:var(--brass);}
  @keyframes fillGrow{0%,8%{width:0%;}45%{width:100%;}100%{width:100%;}}
  .eng-infect.play .fill{animation:fillGrow 6.4s ease forwards;}
  @keyframes appFade{0%,46%{opacity:1;}56%{opacity:0;}100%{opacity:0;}}
  @keyframes skullFade{0%,46%{opacity:0;}56%{opacity:1;}100%{opacity:1;}}
  .eng-infect.play .app{animation:appFade 6.4s ease forwards;}
  .eng-infect.play .skull{animation:skullFade 6.4s ease forwards;}
  .eng-infect.play .attacker{animation:xFade 6.4s ease forwards;}
  @keyframes dataFly1{0%,62%{opacity:0;left:44%;top:50%;}74%{opacity:1;}100%{opacity:1;left:80%;top:34%;}}
  @keyframes dataFly2{0%,70%{opacity:0;left:44%;top:56%;}82%{opacity:1;}100%{opacity:1;left:80%;top:44%;}}
  .eng-infect.play .fly1{animation:dataFly1 6.4s ease forwards;}
  .eng-infect.play .fly2{animation:dataFly2 6.4s ease forwards;}

  .eng-steal .phone{left:42%;top:56%;font-size:30px;}
  .eng-steal .hand{left:-10%;top:56%;font-size:30px;}
  .eng-steal .crack{left:42%;top:56%;font-size:20px;opacity:0;}
  @keyframes handIn{0%{left:-10%;}40%{left:38%;}60%{left:38%;}100%{left:96%;}}
  .eng-steal.play .hand{animation:handIn 6.4s ease-in-out forwards;}
  @keyframes phoneGo{0%,40%{left:42%;opacity:1;}60%{left:42%;opacity:1;}100%{left:96%;opacity:0;}}
  .eng-steal.play .phone{animation:phoneGo 6.4s ease-in-out forwards;}
  @keyframes crackPop{0%,55%{opacity:0;transform:scale(0.4) rotate(0deg);}65%{opacity:1;transform:scale(1.2) rotate(-8deg);}100%{opacity:0.85;transform:scale(1) rotate(-8deg);}}
  .eng-steal.play .crack{animation:crackPop 6.4s ease forwards;}
  @keyframes leak1{0%,60%{opacity:0;left:42%;top:56%;}70%{opacity:1;}100%{opacity:1;left:20%;top:84%;}}
  @keyframes leak2{0%,66%{opacity:0;left:46%;top:60%;}78%{opacity:1;}100%{opacity:1;left:66%;top:88%;}}
  .eng-steal.play .fly1{animation:leak1 6.4s ease forwards;}
  .eng-steal.play .fly2{animation:leak2 6.4s ease forwards;}

  /* Evil Twin / Rogue AP duplication */
  .eng-duplicate .apReal{left:12%;top:16%;font-size:26px;}
  .eng-duplicate .apFake{left:12%;top:62%;font-size:26px;}
  .eng-duplicate .you{left:78%;top:42%;font-size:28px;}
  .eng-duplicate .lineReal{position:absolute;left:28%;top:26%;width:46%;height:2px;background:repeating-linear-gradient(90deg,var(--paper-dim) 0 6px, transparent 6px 12px);opacity:0.55;}
  .eng-duplicate .lineFake{position:absolute;left:28%;top:66%;width:0%;height:2px;background:var(--alert);opacity:0;}
  .eng-duplicate .flyicon{left:50%;top:66%;font-size:14px;opacity:0;}
  @keyframes fakeGrow{0%,32%{width:0%;opacity:0;}48%{opacity:1;}100%{width:46%;opacity:1;}}

/* ============ KAMUS ISTILAH TEKNIS ============ */
const GLOSSARY = [
  {match:'wpa2', term:'WPA2 / WPA3', def:'Standar enkripsi Wi-Fi modern yang mengacak datamu supaya tidak bisa dibaca sembarang orang di jaringan yang sama.'},
  {match:'wep', term:'WEP', def:'Standar enkripsi Wi-Fi lama, pendahulu WPA — jauh lebih lemah dan bisa dibobol hanya dengan mengumpulkan cukup banyak paket data.'},
  {match:'vpn', term:'VPN', def:'Virtual Private Network — "terowongan" terenkripsi yang menyembunyikan trafficmu dari jaringan yang kamu lewati.'},
  {match:'mac ', term:'MAC Address / MAC Spoofing', def:'MAC Address adalah alamat unik tiap perangkat jaringan. MAC Spoofing berarti peretas memalsukan alamat itu supaya perangkatnya terlihat sah.'},
  {match:'man-in-the-middle', term:'Man-in-the-Middle (MITM)', def:'Serangan di mana peretas menyisipkan diri di tengah jalur komunikasi dua pihak, lalu membaca atau mengubah data yang lewat.'},
  {match:'denial of service', term:'Denial of Service (DoS)', def:'Serangan yang membuat sebuah layanan atau jaringan tidak bisa diakses, biasanya dengan membanjirinya dengan traffic atau sinyal pengganggu.'},
  {match:'enkripsi', term:'Enkripsi', def:'Proses mengubah data menjadi kode acak, supaya hanya pihak yang punya kunci yang bisa membacanya.'},
  {match:'mobile device management', term:'Mobile Device Management (MDM)', def:'Sistem yang dipakai tim IT untuk mengelola, mengamankan, dan menghapus data dari jarak jauh pada perangkat yang terhubung ke sumber daya perusahaan.'},
  {match:'shadow it', term:'Shadow IT', def:'Penggunaan perangkat, aplikasi, atau layanan di luar pengawasan dan kebijakan resmi tim IT organisasi.'},
  {match:'container', term:'Container / Profil Kerja', def:'"Ruang" terpisah di dalam satu perangkat yang memisahkan data dan aplikasi kerja dari data pribadi, supaya bisa dikelola tanpa menyentuh sisi pribadi.'},
  {match:'remote wip', term:'Remote Wipe', def:'Kemampuan menghapus data dari jarak jauh lewat sistem terpusat — biasanya dipakai saat perangkat hilang, dicuri, atau penggunanya keluar dari organisasi.'},
  {match:'malicious code', term:'Malicious Code / Malware', def:'Program atau kode yang sengaja dibuat untuk merusak, mencuri data, atau mengambil alih kendali sebuah perangkat.'},
  {match:'antivirus', term:'Antivirus / Mobile Security', def:'Aplikasi yang memindai dan mendeteksi program berbahaya sebelum atau saat ia berjalan di perangkatmu.'},
  {match:'root/jailbreak', term:'Root / Jailbreak', def:'Proses membuka akses penuh ke sistem operasi perangkat — sering kali mematikan lapisan proteksi bawaan yang seharusnya melindungimu.'},
  {match:'otp', term:'OTP (One-Time Password)', def:'Kode sekali pakai untuk memverifikasi identitasmu, biasanya dikirim lewat SMS atau aplikasi otentikasi.'},
  {match:'wireless intrusion prevention', term:'WIPS', def:'Sistem yang memantau jaringan Wi-Fi untuk mendeteksi dan merespons aktivitas mencurigakan seperti rogue AP atau jamming.'},
  {match:'firmware', term:'Firmware', def:'Perangkat lunak dasar yang tertanam di sebuah perangkat untuk menjalankan fungsi intinya — perlu di-update seperti aplikasi biasa.'},
  {match:'permission', term:'Permission (Izin Aplikasi)', def:'Akses yang diminta sebuah aplikasi ke bagian tertentu perangkatmu, seperti kontak, kamera, atau lokasi.'},
  {match:'pelanggaran data', term:'Data Breach', def:'Insiden ketika data sensitif atau rahasia diakses, dicuri, atau bocor ke pihak yang tidak berwenang.'},
  {match:'passphrase', term:'Passphrase', def:'Kata sandi jaringan Wi-Fi — makin panjang dan acak, makin sulit ditebak atau dibobol.'},
  {match:'ssid', term:'SSID', def:'Nama yang muncul saat kamu mencari jaringan Wi-Fi di HP atau laptop.'},
  {match:'evil twin', term:'Evil Twin', def:'Varian Rogue Access Point yang meniru nama jaringan asli persis, biasanya dengan sinyal dibuat lebih kuat supaya korban memilihnya.'},
  {match:'end-to-end', term:'End-to-End Encryption', def:'Enkripsi yang membuat data hanya bisa dibaca oleh pengirim dan penerima — bahkan penyedia layanan di tengahnya tidak bisa membacanya.'},
  {match:'data loss prevention', term:'Data Loss Prevention (DLP)', def:'Kebijakan atau alat yang mencegah data sensitif organisasi berpindah ke tempat yang tidak seharusnya, misalnya ke akun pribadi.'},
  {match:'deprovision', term:'Deprovisioning', def:'Proses mencabut akses seorang pengguna atau perangkat dari sistem organisasi, biasanya dilakukan saat offboarding.'}
];
function glossaryFor(attack){
  const text = (attack.title+' '+attack.captions.join(' ')+' '+attack.fact+' '+attack.impact+' '+attack.defense.join(' ')).toLowerCase();
  const out = [];
  GLOSSARY.forEach(g=>{
    if(out.length>=6) return;
    if(text.indexOf(g.match)!==-1) out.push(g);
  });
  return out;
}

function renderChapter(){

function showConsequence(choice, ch){
  const good = choice.outcome === 'good';
  if(good) state.score++;
  state.answers.push({ chapter: ch.key, outcome: choice.outcome });
  const zone = document.getElementById('consequenceZone');
  zone.innerHTML =
    '<div class="consequence '+(good?'good':'bad')+'">'+
      '<div class="tag mono">'+(good?'✓ Aman':'⚠ Celah Terbuka')+'</div>'+
      '<h3>'+choice.title+'</h3><p>'+choice.body+'</p>'+
      '<div class="fact"><b>Kenapa:</b> '+choice.fact+'</div>'+
    '</div>'+
    '<button class="btn btn-primary" id="nextBtn">'+(state.chIndex < CHAPTERS.length-1 ? 'Lanjut →' : 'Lihat Hasil →')+'</button>';
  document.getElementById('nextBtn').onclick = ()=>{
    if(state.chIndex < CHAPTERS.length-1){ state.chIndex++; renderChapter(); }
    else{ renderResult(); }
  };
}

function renderAttackDetail(){
  const attack = ATTACKS.find(a=>a.key===labState.currentKey);
  const idx = ATTACKS.findIndex(a=>a.key===labState.currentKey);
  const terms = glossaryFor(attack);
  const glossaryHTML = terms.length
    ? '<div class="info-block"><div class="tag" style="color:var(--paper-dim);">🔤 Istilah teknis di sini</div>'+
        terms.map(t=>'<div class="gterm"><b>'+t.term+'</b><span>'+t.def+'</span></div>').join('')+
      '</div>'
    : '';
  app.innerHTML =
  '<div class="screen active">'+
    '<div class="lab-header"><button class="back-btn" id="backLab">←</button><div><span class="cattag" style="display:block;">'+attack.catLabel+'</span><h2 style="margin:0;font-size:20px;">'+attack.title+'</h2></div></div>'+
    attackStageHTML(attack)+
    '<div class="caption-dots" id="capDots">'+attack.captions.map(()=>'<span></span>').join('')+'</div>'+
    '<div class="caption-box mono" id="capBox">Ketuk putar untuk mulai.</div>'+
    '<div class="attack-nav">'+
      '<button class="btn btn-primary" id="playBtn" style="flex:1;">▶ Jalankan Simulasi</button>'+
    '</div>'+

      '<div class="info-block"><div class="tag">📖 Bagaimana ini bekerja</div><p>'+attack.fact+'</p></div>'+

      glossaryHTML+
    '</div>'+
    '<div class="attack-nav" style="max-width:340px;">'+
      '<button class="btn btn-ghost" id="prevAtk" style="flex:1;">← Sebelumnya</button>'+
      '<button class="btn btn-ghost" id="nextAtk" style="flex:1;">Berikutnya →</button>'+
    '</div>'+
  '</div>';

  document.getElementById('backLab').onclick = ()=>{ clearCaptionTimers(); renderLabHome(); };
  document.getElementById('playBtn').onclick = ()=> playAttack(attack);
  document.getElementById('prevAtk').onclick = ()=>{ clearCaptionTimers(); labState.currentKey = ATTACKS[(idx-1+ATTACKS.length)%ATTACKS.length].key; renderAttackDetail(); };
  document.getElementById('nextAtk').onclick = ()=>{ clearCaptionTimers(); labState.currentKey = ATTACKS[(idx+1)%ATTACKS.length].key; renderAttackDetail(); };
}

function clearCaptionTimers(){ capTimers.forEach(t=>clearTimeout(t)); capTimers = []; }

function playAttack(attack){
  clearCaptionTimers();
  const stage = document.querySelector('.attack-stage');
  if(!stage) return;
  stage.classList.remove('play');
  void stage.offsetWidth; // force reflow to restart CSS animations
  stage.classList.add('play');

  const dots = document.querySelectorAll('#capDots span');
  const capBox = document.getElementById('capBox');
  const n = attack.captions.length;
  attack.captions.forEach((text,i)=>{
    const t = Math.round(i*(ENGINE_MS/n));
    capTimers.push(setTimeout(()=>{
      capBox.textContent = text;
      dots.forEach((d,di)=> d.classList.toggle('on', di===i));
    }, t));
  });
  const playBtn = document.getElementById('playBtn');
  if(playBtn) playBtn.innerHTML = '▶ Sedang berjalan…';
  capTimers.push(setTimeout(()=>{ if(playBtn) playBtn.innerHTML = '↻ Putar Ulang'; }, ENGINE_MS));
}

/* ============ HOST / PRESENTER MODE ============ */
async function computeAggregate(){
  if(!sbClient) return { count:0, avg:'0.0', byChapter:Object.fromEntries(CHAPTERS.map(c=>[c.key,{good:0,total:0}])) };
  const { data, error } = await sbClient.rpc('get_dashboard_stats');
  if(error) throw error;
  const stats = data || {};
  return {
    count: Number(stats.count || 0),
    avg: Number(stats.avg || 0).toFixed(1),
    byChapter: stats.byChapter || Object.fromEntries(CHAPTERS.map(c=>[c.key,{good:0,total:0}]))
  };
}
let hostInterval = null;
function renderHost(){
  app.innerHTML =
  '<div class="screen active" style="justify-content:flex-start;padding-top:48px;">'+
    '<div class="host-header"><div><div class="eyebrow"><span class="live-dot"></span>Dashboard Presenter — Live</div><h2 style="margin:0;font-size:26px;">Pintu Tak Terkunci</h2></div>'+
      '<button class="btn btn-ghost mono" id="exitHost">← Keluar Mode Presenter</button></div>'+
    '<div class="host-grid">'+
      '<div class="qr-card"><div id="qrcode"></div><div class="cap">SCAN UNTUK IKUT SIMULASI<br>'+location.href.split('?')[0]+'</div></div>'+
      '<div class="stat-card"><h4>Peserta Selesai (Mode Cerita)</h4><div class="stat-num" id="participantCount">0</div>'+
        '<h4 style="margin-top:18px;">Rata-rata Skor</h4><div class="stat-num" id="avgScore">0.0<span style="font-size:20px;color:var(--paper-dim);">/'+CHAPTERS.length+'</span></div></div>'+
    '</div>'+
    '<div class="host-grid" style="margin-top:18px;"><div class="stat-card" style="grid-column:1/-1;">'+
      '<h4 style="margin-bottom:14px;">Persentase Pilihan Aman per Bab</h4><div id="chapterStats"></div>'+
    '</div></div>'+
  '</div>';
  new QRCode(document.getElementById('qrcode'), { text: location.href.split('?')[0], width:148, height:148, colorDark:'#0A0E1A', colorLight:'#F6F2E7' });
  document.getElementById('exitHost').onclick = ()=>{ if(hostInterval) clearInterval(hostInterval); renderIntro(); };
  refreshHostStats();
  hostInterval = setInterval(refreshHostStats, 4000);
  if(!SUPABASE_READY){
    const note = document.createElement('div');
    note.className = 'footer-note';
    note.textContent = 'Supabase belum dikonfigurasi — isi SUPABASE_URL dan SUPABASE_PUBLISHABLE_KEY di file index.html.';
    document.querySelector('.screen.active').appendChild(note);
  }
}
async function refreshHostStats(){
  try{
    const agg = await computeAggregate();
    const cEl = document.getElementById('participantCount'); const aEl = document.getElementById('avgScore');
    if(cEl) cEl.textContent = agg.count;
    if(aEl) aEl.innerHTML = agg.avg + '<span style="font-size:20px;color:var(--paper-dim);">/'+CHAPTERS.length+'</span>';
    const box = document.getElementById('chapterStats');
    if(box){
      box.innerHTML = CHAPTERS.map(c=>{
        const s = agg.byChapter[c.key] || {good:0,total:0};
        const pct = s.total ? Math.round(100*s.good/s.total) : 0;
        return '<div class="chapter-stat"><div class="lbl2"><span>'+c.label+'</span><span class="mono">'+pct+'% aman ('+s.good+'/'+s.total+')</span></div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
      }).join('');
    }
  }catch(e){}
}

document.getElementById('hostToggle').onclick = renderHost;
renderIntro();
